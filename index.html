<style>
/* Layout concept: a full-viewport desktop OS. Fixed menu bar on top, floating dock at the bottom,
   free-floating windows between. Everything sits on KalaOS's 8px grid, tokens from kalaos.tokens.json. */
:root {
  --bg:#070812; --panel:#0a0b18; --surface:#0b0d1d; --glass:#15132b;
  --tx:#f6f0ff; --tx2:#c6b9e8; --tx3:#83729f;
  --violet:#a78bfa; --lav:#c4b5fd; --cyan:#22d3ee; --amber:#d39a52; --green:#27c93f; --red:#ff5f56;
  --hair:#2d2257; --bd:#362a68; --glow:rgba(167,139,250,.18); --grid:rgba(131,114,159,.10); --gridmajor:rgba(131,114,159,.16); --wm:.1; --particle:#d8cbff;
  --shadow:0 24px 64px rgba(0,0,0,.5); --paper:#fffdfc; --paper-tx:#1d1730; --paper-tx2:#5d5470; --paper-bd:#d8cfef;
  --accent:var(--violet);
  --ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --mb:calc(28px + var(--sat));
  color-scheme:dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg:#f5f0ff; --panel:#fffdfc; --surface:#ffffff; --glass:#f1ebff;
  --tx:#1d1730; --tx2:#5d5470; --tx3:#7a7094;
  --violet:#7c3aed; --lav:#b9a3f7; --cyan:#0891b2; --amber:#9a5f1c; --green:#15803d; --red:#dc2626;
  --hair:#d8cfef; --bd:#d4c8ee; --glow:rgba(124,58,237,.22); --grid:rgba(124,58,237,.10); --gridmajor:rgba(124,58,237,.18); --wm:.22; --particle:#7c3aed;
  --shadow:0 24px 56px rgba(60,40,120,.18); color-scheme:light; } }
:root[data-theme="light"] {
  --bg:#f5f0ff; --panel:#fffdfc; --surface:#ffffff; --glass:#f1ebff;
  --tx:#1d1730; --tx2:#5d5470; --tx3:#7a7094;
  --violet:#7c3aed; --lav:#b9a3f7; --cyan:#0891b2; --amber:#9a5f1c; --green:#15803d; --red:#dc2626;
  --hair:#d8cfef; --bd:#d4c8ee; --glow:rgba(124,58,237,.22); --grid:rgba(124,58,237,.10); --gridmajor:rgba(124,58,237,.18); --wm:.22; --particle:#7c3aed;
  --shadow:0 24px 56px rgba(60,40,120,.18); color-scheme:light; }
:root[data-accent="cyan"]{--accent:var(--cyan)} :root[data-accent="amber"]{--accent:var(--amber)} :root[data-accent="green"]{--accent:var(--green)}

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:14px/1.5 var(--ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mk line{stroke:var(--violet);stroke-width:4;stroke-linecap:round} .mk circle{fill:var(--violet)}
.mono{font-family:var(--mono)}

#os{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
/* wallpaper */
#wall{position:absolute;inset:0;background:
  radial-gradient(ellipse 60% 50% at 50% 46%,var(--glow),transparent 70%),
  linear-gradient(var(--gridmajor) 1px,transparent 1px) 0 0/64px 64px,
  linear-gradient(90deg,var(--gridmajor) 1px,transparent 1px) 0 0/64px 64px,
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/8px 8px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/8px 8px,
  linear-gradient(180deg,color-mix(in srgb,var(--violet) 9%,var(--bg)),var(--bg) 70%)}
#wall canvas{position:absolute;inset:0;width:100%;height:100%}
#wall .wm{position:absolute;left:50%;top:48%;width:min(46vh,360px);transform:translate(-50%,-50%);opacity:var(--wm)}
#wall .wm svg{width:100%;height:auto;display:block}
#wall .bp{display:none;position:absolute;inset:0}
[data-wall="plain"] #wall{background:var(--bg)}
[data-wall="plain"] #wall canvas{display:none}
[data-wall="aurora"] #wall,[data-wall="highlands"] #wall{background:var(--bg)}
[data-wall="aurora"] #wall .wm,[data-wall="highlands"] #wall .wm{display:none}
[data-wall="blueprint"] #wall{background:
  linear-gradient(var(--gridmajor) 1px,transparent 1px) 0 0/48px 48px,
  linear-gradient(90deg,var(--gridmajor) 1px,transparent 1px) 0 0/48px 48px,var(--bg)}
[data-wall="blueprint"] #wall canvas{display:none}
[data-wall="blueprint"] #wall .bp{display:block}
.bp i{position:absolute;width:32px;height:32px;border:2px solid var(--violet);opacity:.55}
.bp i:nth-child(1){left:16px;top:calc(var(--mb) + 16px);border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.bp i:nth-child(2){right:16px;top:calc(var(--mb) + 16px);border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.bp i:nth-child(3){left:16px;bottom:16px;border-right:0;border-top:0;border-radius:0 0 0 10px}
.bp i:nth-child(4){right:16px;bottom:16px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.bp b{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--hair)} .bp u{position:absolute;top:50%;left:0;right:0;height:1px;background:var(--hair)}
.bp s{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px;border:1px solid var(--cyan);border-radius:50%;opacity:.6}
#coords{position:absolute;left:24px;bottom:calc(14px + var(--sab));font:10px/1 var(--mono);letter-spacing:.08em;color:var(--tx3);text-transform:uppercase;pointer-events:none}

/* menu bar */
#mb{position:fixed;top:0;left:0;right:0;height:var(--mb);padding:var(--sat) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:2px;font-size:12px;z-index:1000;
  background:color-mix(in srgb,var(--glass) 72%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--hair)}
#mb .mbtn{padding:3px 9px;border-radius:8px;color:var(--tx2);white-space:nowrap}
#mb .mbtn:hover,#mb .mbtn.on{background:var(--hair);color:var(--tx)}
#mb .app{font-weight:600;color:var(--tx);padding:3px 9px;max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mb .sp{flex:1}
#mb .logo{display:flex;align-items:center;padding:3px 9px}
#mb .logo svg{width:15px;height:15px}
#mb .open{cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--tx2);padding:3px 9px;border-radius:999px;border:1px solid var(--hair);margin-right:4px}
#mb .open i{width:6px;height:6px;border-radius:50%;background:var(--green)}
#mb svg.i{width:15px;height:15px;stroke-width:1.7}
#clock{padding:3px 9px;color:var(--tx);font-variant-numeric:tabular-nums;white-space:nowrap}
.menu{position:fixed;min-width:220px;background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:6px;box-shadow:var(--shadow);z-index:1100;font-size:13px}
.menu .mi{display:flex;justify-content:space-between;gap:24px;width:100%;text-align:left;padding:6px 10px;border-radius:8px;color:var(--tx)}
.menu .mi:hover{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.menu .mi span{color:var(--tx3);font:11px var(--mono)}
.menu .mi.dis{opacity:.38;cursor:default}
.menu a.mi{text-decoration:none;color:var(--tx)}
.menu hr{border:0;border-top:1px solid var(--hair);margin:6px 4px}
.menu .mh{padding:4px 10px;color:var(--tx3);font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase}

/* desktop widgets */
#widgets{position:absolute;left:16px;top:calc(var(--mb) + 16px);width:248px;display:grid;gap:12px}
.wg{background:color-mix(in srgb,var(--glass) 66%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:18px;padding:16px;font-size:13px}
.wg h4{margin:0 0 8px;font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)}
.wg .big{font:300 40px/1 var(--ui);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wg .big small{font-size:13px;color:var(--tx2);margin-left:6px;letter-spacing:.04em}
.wg .sub{color:var(--tx2);font-size:12px;margin-top:6px;line-height:1.45}
.wg .eth{margin-top:12px;padding-top:12px;border-top:1px solid var(--hair)}
.wg .eth b{font:500 18px var(--ui);font-variant-numeric:tabular-nums}
.wg .row{display:flex;align-items:center;gap:10px;width:calc(100% + 16px);margin:0 -8px;text-align:left;padding:6px 8px;border-radius:8px;color:var(--tx)}
.wg .row:hover{background:color-mix(in srgb,var(--accent) 16%,transparent);text-decoration:none}
.wg .row svg{width:16px;height:16px;color:var(--accent);flex:none}
.wg .row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wg .row small{margin-left:auto;color:var(--tx3);font:10px var(--mono)}
.wg .tip{min-height:58px;color:var(--tx2);line-height:1.5;transition:opacity .24s}
@media (max-height:940px){.wg.opt1{display:none}}
@media (max-height:820px){.wg.opt2{display:none}}
@media (max-height:700px){.wg.opt3{display:none}}
.arc{display:flex;gap:8px;flex-wrap:wrap}.arc .btn{padding:6px 12px;font-size:12px}.arc .btn svg{width:14px;height:14px}.arc small{color:var(--tx3);font:10px var(--mono)}

/* windows */
#desk{position:absolute;top:var(--mb);left:0;right:0;bottom:0;pointer-events:none}
.win{pointer-events:auto;position:absolute;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;
  transition:opacity .16s var(--ease),transform .24s var(--ease);animation:winIn .16s var(--ease)}
@keyframes winIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.win.focus{border-color:color-mix(in srgb,var(--accent) 50%,var(--bd))}
.win.min{opacity:0;pointer-events:none;transform:translate(var(--dx),var(--dy)) scale(.2)}
.win.max{left:8px!important;top:8px!important;width:calc(100% - 16px)!important;height:calc(100% - 96px - var(--sab))!important}
.tb{height:40px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--glass);border-bottom:1px solid var(--hair);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.tb:active{cursor:grabbing}
.lights{display:flex;gap:10px;width:80px}
.lights button{width:14px;height:14px;border-radius:50%;background:var(--tx3);opacity:.45;position:relative;cursor:pointer}
.lights button::before{content:"";position:absolute;inset:-9px -5px}
@media (pointer:coarse){.lights{gap:14px;width:100px}.lights button{width:18px;height:18px}.lights button::before{inset:-12px -6px}}
.focus .lights button:nth-child(1){background:var(--red);opacity:1} .focus .lights button:nth-child(2){background:var(--amber);opacity:1} .focus .lights button:nth-child(3){background:var(--green);opacity:1}
.lights button:hover::after{content:attr(data-g);position:absolute;inset:0;display:grid;place-items:center;font:700 10px/1 var(--ui);color:rgba(0,0,0,.7)}
.tt{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--tx2);min-width:0}
.tt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt svg{width:14px;height:14px;flex:none;color:var(--accent)}
.tb .pad{width:64px}
.wb{flex:1;min-height:0;overflow:auto;position:relative;container-type:inline-size}
.rz{position:absolute;z-index:3;touch-action:none}
.rz.n{left:14px;right:14px;top:-3px;height:8px;cursor:ns-resize}.rz.s{left:14px;right:14px;bottom:-3px;height:8px;cursor:ns-resize}
.rz.e{top:14px;bottom:14px;right:-3px;width:8px;cursor:ew-resize}.rz.w{top:14px;bottom:14px;left:-3px;width:8px;cursor:ew-resize}
.rz.ne,.rz.nw,.rz.se,.rz.sw{width:16px;height:16px}
.rz.ne{top:-3px;right:-3px;cursor:nesw-resize}.rz.nw{top:-3px;left:-3px;cursor:nwse-resize}.rz.se{bottom:-3px;right:-3px;cursor:nwse-resize}.rz.sw{bottom:-3px;left:-3px;cursor:nesw-resize}
.win.max .rz{display:none}

/* dock */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--sab));display:flex;gap:8px;padding:8px;max-width:calc(100% - 16px);
  background:color-mix(in srgb,var(--glass) 78%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:20px;z-index:950}
.di{width:46px;height:46px;flex:none;border-radius:12px;background:var(--surface);border:1px solid var(--hair);color:var(--accent);display:grid;place-items:center;position:relative;transition:transform .16s var(--ease),border-color .16s}
.di:hover{transform:translateY(-4px);border-color:var(--accent)}
.di.run::after{content:"";position:absolute;bottom:-6px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--cyan)}
.di:hover::before{content:attr(data-l);position:absolute;bottom:56px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:3px 10px;font-size:12px;white-space:nowrap;color:var(--tx);pointer-events:none}
.dsep{width:1px;background:var(--hair);margin:4px 2px}

/* overlays */
#toasts{position:fixed;top:calc(var(--mb) + 8px);right:12px;width:min(340px,calc(100% - 24px));display:grid;gap:8px;z-index:1050;pointer-events:none}
.toast{pointer-events:auto;background:color-mix(in srgb,var(--glass) 92%,transparent);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:20px 1fr;gap:4px 12px;box-shadow:var(--shadow);animation:winIn .24s var(--ease);font-size:13px}
.toast .mk{width:18px;height:18px;margin-top:2px} .toast>div>b{display:block;font-weight:600}.toast p b{font-weight:600;color:var(--tx)} .toast p{margin:2px 0 0;color:var(--tx2);font-size:12px}
#spot{position:fixed;inset:0;z-index:1200;display:none;align-items:flex-start;justify-content:center;padding-top:14vh;background:color-mix(in srgb,var(--bg) 40%,transparent);backdrop-filter:blur(4px)}
#spot.on{display:flex}
.sp-box{width:min(560px,calc(100% - 32px));background:var(--panel);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.sp-box input{width:100%;background:none;border:0;border-bottom:1px solid var(--hair);color:var(--tx);font:18px var(--ui);padding:16px 20px;outline:0}
.sp-list{max-height:min(46vh,380px);overflow:auto;padding:8px}
.sp-it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 12px;border-radius:12px}
.sp-it{color:var(--tx);text-decoration:none!important}
.sp-it svg{width:18px;height:18px;color:var(--accent);flex:none}
.sp-it small{margin-left:auto;color:var(--tx3);font:11px var(--mono)}
.sp-it.sel{background:color-mix(in srgb,var(--accent) 20%,transparent)}
#ctx{z-index:1150}

/* boot + lock */
#boot{position:fixed;inset:0;z-index:3000;background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/8px 8px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/8px 8px,var(--bg);display:grid;place-items:center;transition:opacity .36s var(--ease)}
#boot.out{opacity:0;pointer-events:none}
.boot-in{display:grid;justify-items:center;gap:24px;padding:16px}
.boot-in svg{width:96px;height:96px}
.boot-t{font:600 28px/1 var(--ui);letter-spacing:.5em;margin-right:-.5em;opacity:0;transition:opacity .36s var(--ease)}
.boot-t.on{opacity:1}
.boot-log{width:min(340px,100%);font:11px/1.9 var(--mono);color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;min-height:130px}
.boot-log div{display:flex;gap:8px;opacity:0;animation:winIn .24s var(--ease) forwards}
.boot-log div::before{content:"";flex:1;order:1;border-bottom:1px dotted var(--hair);margin-bottom:5px}
.boot-log span{order:0;color:var(--tx2)} .boot-log em{order:2;font-style:normal;color:var(--tx)}
.boot-log .ok em{color:var(--green)} .boot-log .rd{color:var(--tx)} .boot-log .rd::before{display:none}
.boot-bar{width:min(340px,100%);height:1px;background:var(--hair)} .boot-bar i{display:block;height:1px;width:0;background:var(--accent);transition:width .24s linear}
.boot-foot{position:absolute;bottom:calc(16px + var(--sab));left:0;right:0;text-align:center;font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
#lock{position:fixed;inset:0;z-index:2000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px;
  background:color-mix(in srgb,var(--bg) 58%,transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);transition:opacity .36s var(--ease),transform .36s var(--ease)}
#lock.on{display:flex} #lock.out{opacity:0;transform:scale(1.02);pointer-events:none}
#lock .mk{width:40px;height:40px;margin-bottom:24px}
#lk-time{font:300 clamp(64px,16vw,112px)/1 var(--ui);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#lk-date{color:var(--tx2);font-size:16px}
#lk-eth{color:var(--tx3);font:12px var(--mono);letter-spacing:.04em;margin-top:4px}
#lk-time small{font-size:.26em;font-weight:400;margin-left:.35em;color:var(--tx2);letter-spacing:.06em}
.lk-user{margin-top:32px;font-size:13px;color:var(--tx2)} .lk-user b{color:var(--tx);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;border:1px solid var(--bd);background:var(--glass);color:var(--tx);font-size:13px;transition:border-color .16s,background .16s}
.btn:hover{border-color:var(--accent)} .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root:not([data-theme="light"]) .btn.pri{color:#070812}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn.pri{color:#fff}}
.lk-hint{margin-top:16px;font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}

/* ---------- app styles ---------- */
.pad16{padding:16px 24px 24px}
.wb h2{font:600 22px/1.25 var(--ui);margin:0 0 8px;letter-spacing:.01em}
.wb h3{font:600 11px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin:24px 0 8px}
